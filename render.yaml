# Render Blueprint for the Ayoola Platform backend (Node.js + Express API).
# In Render: New + > Blueprint, connect this GitHub repo, and Render reads this file.
# You'll be prompted to fill in the values marked `sync: false` (they are NOT stored in git).
services:
  - type: web
    name: ayoola-platform-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # --- Database (MongoDB Atlas) ---
      - key: MONGODB_URI          # e.g. mongodb+srv://user:pass@cluster.mongodb.net
        sync: false
      - key: DB_NAME
        value: ayoola-platform
      # --- Admin login ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH  # generate with backend/src/scripts/hashAdminPassword.ts
        sync: false
      - key: ADMIN_JWT_SECRET     # auto-generated secure random value
        generateValue: true
      # --- Frontend URL (your Netlify site, e.g. https://your-site.netlify.app) ---
      - key: FRONTEND_URL
        sync: false
      # --- Email (Resend) — optional; leave blank to disable outgoing email ---
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # --- AI provider — optional; leave blank to disable AI features ---
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_MODEL
        sync: false
