eyebrow: About
title: The engineer *behind the systems.*

lead: >-
  I'm Ayoola, a software engineer in Lagos. I design, build and run the
  systems businesses depend on: accounting pipelines, payment platforms,
  compliance tools and SaaS products.

story:
  - >-
    I started in 2022 as an intern at Broadcaad in Lagos, building Node.js
    APIs, and was taken on full-time within six months. Next I spent a year
    and a half as the only engineer on a booking platform for a services
    company. Contract work since then has taken me into Python, C# and PHP as
    well as TypeScript. Most of what I know I taught myself while doing the
    job.
  - >-
    Today I split my time between two contracts and my own product. On an
    agentic month-end-close platform for an accounting firm, I built the
    human-approval system and several of the close pipelines underneath the
    AI. For a software agency, I'm the lead
    engineer on client products: a food-safety compliance SaaS, a tipping
    platform on Stripe Connect, a multi-tenant CRM and more. And I'm building
    OpsFlow, my own order desk for Lagos vendors who sell on WhatsApp.
  - >-
    The part I enjoy most is the work nobody sees but everybody leans on:
    schemas that refuse bad data, money logic that adds up, and systems that
    keep running after I hand them over.
  - >-
    I use coding agents heavily, and I'm open about it. They let one engineer
    deliver what used to take a team. The architecture, the decisions and the
    verification stay with me: integration tests that boot the real app,
    audits of my own work, and written status that says what isn't done yet.
  - >-
    In 2024 I spoke at GDG Lagos DevFest on building high-performance APIs
    with gRPC.

