lead: >-
  I'm Ayoola, a software engineer in Lagos. I design, build and run the
  systems businesses depend on: accounting pipelines, payment platforms,
  compliance tools and SaaS products.

storyTitle: The story so far
# The first paragraph is set large, as the lead line.
story:
  - >-
    I was always a fan of new technology, just from the outside. About ten
    years ago, a random conversation with friends who were coding pulled me
    in. Who knew something that would shape my whole future could start like
    that?
  - >-
    It's been a rewarding ride. I've been the only engineer on platforms whole
    businesses ran on, and that teaches you quickly to build things that still
    work long after the demo.
  - >-
    These days I keep it simple: work on the things that matter most, like
    software that handles money, compliance and people's data, do it properly,
    and have fun doing it. I'm in Lagos, working with teams anywhere. Tell me
    what you're building.

