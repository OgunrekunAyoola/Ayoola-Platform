lead: >-
  I'm Ayoola, a software engineer in Lagos. I design, build and run the
  systems businesses depend on: accounting pipelines, payment platforms,
  compliance tools and SaaS products.

storyTitle: The story so far
# The first paragraph is set large, as the lead line.
story:
  - >-
    On one job, the first thing I had to do was find a live app's source
    code. There was no repository, no schema and no way into the database.
  - >-
    It was a salon-booking marketplace with real bookings going through it. I
    pulled the code back out of the hosting platform, proved it matched what
    was running, and rebuilt the database schema from the queries in the code.
    Along the way I found two ways accounts could be taken over. Both were
    closed within days.
  - >-
    That job is typical of what I take on. On an AI platform that runs the
    month-end close for an accounting firm, I built the step where a person
    approves what the AI flags, and wrote a payroll pipeline where every
    figure comes from code and the model only writes the sentences. For an
    agency, I took a food-safety compliance product from first commit to a
    public pilot in six weeks, directing a team of coding agents. And I'm
    building OpsFlow, my own order desk for Lagos vendors who sell on
    WhatsApp.
  - >-
    What ties it together: the parts that have to be right. *Schemas that
    refuse bad data, money logic that adds up, systems
    that keep running after I've handed them over.* If you're building
    something that has to be right, I'd like to hear about it.

