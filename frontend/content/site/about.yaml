storyTitle: The story so far
# The first paragraph is set large, as the lead line.
story:
  - >-
    On one job, the first thing I had to do was find a live app's source
    code. There was no repository, no schema and no way into the database.
  - >-
    It was a salon-booking marketplace with real bookings going through it. I
    pulled the code back out of the hosting platform, proved it matched what
    was running, and rebuilt the database schema from the queries in the code.
    Along the way I found two ways accounts could be taken over. Both were
    closed within days.
  - >-
    Four years earlier, my first public code was a set of CSS exercises. That
    year I joined Broadcaad in Lagos as an intern writing Node.js APIs, and I
    was full-time within six months. Then I spent a year and a half as the
    only engineer at a services company, running its booking platform. When
    every outage is yours, you stop building things that only work in the
    demo.
  - >-
    These days I work in three very different places at once.
  - >-
    On an AI platform that runs the month-end close for an accounting firm, I
    built the step where a person approves what the AI flags. Then I watched a
    model say it was 95% sure about a transaction it had got wrong. So in the
    payroll pipeline I wrote, the model's confidence decides nothing. Every
    figure comes from code, every anomaly reaches a person, and the model only
    writes the sentences.
  - >-
    For an agency, I took a food-safety compliance product from first commit
    to a public pilot in six weeks, running a team of coding agents. They
    wrote most of the code. I set the direction, wrote the brief their
    reviewers followed, merged every change and ran every deploy. Nothing in
    it can be quietly deleted: the database itself refuses, because an
    inspector has to be able to trust every record.
  - >-
    And I'm building OpsFlow, my own order desk for Lagos vendors who sell on
    WhatsApp. When Meta launched its own WhatsApp AI, I tried it as a customer
    of a real Lagos vendor. It couldn't tell me the price of a product in the
    vendor's own ad. Answering is the easy part. Getting a chat to a confirmed
    order is the job.
  - >-
    Three different worlds, one thread: the work nobody sees but everybody
    leans on. *Schemas that refuse bad data, money logic that adds up, systems
    that keep running after I've handed them over.* If you're building
    something that has to be right, I'd like to hear about it.

