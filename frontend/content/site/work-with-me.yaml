# Work with me page. Wrap a phrase in *asterisks* for the italic serif emphasis.

meta:
  title: Work with me
  description: >-
    Full-time remote software engineering roles, or fixed-scope contract
    builds and rescues for systems that handle money, compliance or customer
    data.

intro:
  eyebrow: Work with me
  title: Two ways to *work together.*
  sub: >-
    I'm based in Lagos and work with teams worldwide. Clear scope, honest
    status, production standards.

anchors:
  roles: Full-time roles ↓
  builds: Contract builds ↓

roles:
  title: Full-time remote roles
  body: >-
    I'm open to full-time remote roles as a backend, full-stack or platform
    engineer, including applied AI. I fit best on teams where the software
    touches money, compliance or customer data, and where one engineer is
    trusted to own a system from schema to production.
  bringTitle: What I bring
  bring:
    - "Data design that enforces the rules: Postgres row-level security, grants, versioned records, audit trails"
    - "Careful payments: Stripe Connect and subscriptions, SeerBit, idempotent webhooks, reconciliation"
    - "Production ownership on AWS and VPS: Lambda, API Gateway, SQS, KMS, RDS, S3, CloudFormation, Docker"
    - "Applied AI with limits: LangGraph pipelines, human approval in Slack, graded LLM evals"
    - "Range across stacks: TypeScript, Python, C# and PHP; NestJS, Next.js, .NET and Laravel"
    - Taking over inherited systems and getting them stable

builds:
  title: Contract builds
  tagline: For software where mistakes are expensive.
  body: >-
    For founders and teams whose product handles money, compliance records or
    other people's data, and has to be right from the start.
  offers:
    - title: Rescue & stabilise
      body: >-
        For a live system that's broken, inherited or missing its source
        repository.
        I work out what's actually running, close the security holes, get it
        deploying again and write down everything I find.
      includes:
        - Code under version control, proven to match what's live
        - The schema, config and deploys mapped as they really are
        - Security holes closed first
        - Required checks, so every change ships safely
        - A written record of everything I found
    - title: Product build
      featured: true
      body: >-
        I design, build and deploy your product end to end, then hand it over
        with everything your team needs to run it.
      includes:
        - Architecture and data model
        - Business rules enforced in the database, not only the UI
        - Payments and webhooks that reconcile
        - Integration tests against the running app
        - CI/CD and infrastructure as code
        - Handoff docs, runbooks and a walkthrough

process:
  title: How it works
  steps:
    - title: Discovery
      body: A 30-minute call about the problem, not a sales pitch.
    - title: Scope
      body: A written scope we both agree on before any work starts.
    - title: Build
      body: Weekly demos, so you see progress as it happens.
    - title: Handoff
      body: Documentation, runbooks and a walkthrough for your team.

closing:
  title: Not sure which fits?
  body: >-
    Tell me what you're building. I'll tell you honestly whether and how I can
    help.
