# Contact page. Wrap a phrase in *asterisks* for the green emphasis.

meta:
  title: Contact
  description: >-
    Tell me what you're building and where it's stuck. Send a message and
    I'll reply within two business days.

eyebrow: Contact
title: Let's talk about *what you're building.*
sub: >-
  Tell me what you're building and where it's stuck. I read every message and
  reply within two business days.
bookLabel: Book a 30-minute call

form:
  title: Send me *a message.*
  # Keep in step with the three offers on the Services page. `key` is what
  # /contact?type=<key> preselects (e.g. /contact?type=rescue); `label` is
  # shown in the form and in the email subject.
  inquiryTypes:
    - key: rescue
      label: Rescue & security audit
      # Replaces the message label while this type is selected.
      messageLabel: What's worrying you about the app?
    - key: build
      label: Product build
    - key: ai
      label: AI & finance automation
    - key: other
      label: Something else
  # Nothing is selected unless the link carries ?type=.
  messageLabel: What are you building?
  messagePlaceholder: A few sentences about the system, the timeline, and where you're stuck…
  # If the form can't send (not configured, provider down), this button opens the
  # visitor's mail app with their message already written, so nothing is lost.
  fallbackCta: Send it by email instead →
  sent:
    title: Message *sent.*
    body: Thanks for reaching out. I'll get back to you within two business days.
    again: Send another
