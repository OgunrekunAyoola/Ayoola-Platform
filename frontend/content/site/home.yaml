services:
  eyebrow: What I do
  title: Engineering across *the whole stack.*
  aside: One engineer from interface to infrastructure, so nothing falls between the gaps.
  items:
    - title: Full-stack products
      body: Web apps from database to interface, in TypeScript, Next.js, NestJS, .NET and Laravel.
      href: /services#builds
    - title: Backend & data
      body: "Postgres schemas that enforce the rules: row-level security, versioned records, audit trails."
      href: /services#builds
    - title: Payments
      body: Stripe, Paystack or SeerBit, set up so nothing is charged twice and every transaction reconciles.
      href: /services#builds
    - title: Cloud & DevOps
      body: Your own cloud account, set up as code with CI/CD, so shipping is boring and your team can run it without me.
      href: /services#builds
    - title: AI systems
      body: LangGraph pipelines and agents with human approval, evals and an audit trail.
      href: /services#ai

work:
  eyebrow: Selected work
  title: The work, *in detail.*
  action:
    label: All work →
