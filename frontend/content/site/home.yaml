# Rescue & security audit, low on the page. The two prices come from the
# rescue offers in services.yaml, so they live in one place.
rescue:
  eyebrow: Rescue & security audit
  title: Built it fast? *Make sure it's safe.*
  body: >-
    For founders who shipped with Lovable, Bolt, Cursor or v0 on Supabase or
    Firebase, and now take payments or hold personal data. I find the holes,
    fix the serious ones and prove they're closed.
  primary:
    label: Request a quick scan
    href: /contact?type=rescue
  secondary:
    label: How the audit works →
