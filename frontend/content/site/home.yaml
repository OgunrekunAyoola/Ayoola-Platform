principles:
  eyebrow: Principles
  title: How I build software *people rely on*
  items:
    - title: The rules live in the system
      body: >-
        If a record must never be deleted, the database refuses the delete. If
        a refund needs two people, the code won't move money with one.
        Correctness shouldn't depend on everyone remembering.
    - title: I own it after launch
      body: >-
        Schema, infrastructure, deploys, monitoring and the fix at 2am. Most of
        my work has been as the only engineer, so nothing is someone else's
        problem.
    - title: AI never signs off
      body: >-
        Where a product uses AI, the model reads and drafts. It doesn't approve
        payments or post figures. Numbers come from code, and a person approves
        anything that matters.
    - title: Shown, not claimed
      body: >-
        Integration tests that boot the real app, audits of my own work, and
        status notes that say what isn't finished. The case studies work the
        same way.

