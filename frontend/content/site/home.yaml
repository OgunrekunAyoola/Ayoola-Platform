# AI systems teaser. The illustrative run log comes from the AI section of
# services.yaml; these ✓ points are Home's own (Services doesn't repeat them).
ai:
  eyebrow: AI systems
  title: AI kept *in its place.*
  body: >-
    Approval steps, money logic computed in code, evals and an audit trail
    around the model, so AI can do real work without having the final say.
  points:
    - Approve, reject and resume flows in Slack, live in production
    - Payroll figures computed in code; the model only writes sentences
    - Output gates that stop a bot from confirming a payment
  action:
    label: See AI systems →
    href: /services#ai

