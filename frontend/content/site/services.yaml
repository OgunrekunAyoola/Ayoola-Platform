# Services page: three offers on one page. Wrap a phrase in *asterisks* for
# the green emphasis.
#
# Prices: only two are public, both on the rescue offer (Quick scan $450 fixed,
# Audit + fix from $2,500). Everything else says "Quoted after a call". Prices
# are display text only: there's no checkout; payment is by invoice.
#
# Proof items point at case studies by slug; every claim here traces to one.

meta:
  title: Services
  description: >-
    Rescue & security audits for apps built fast on Supabase or Firebase
    (quick scan $450, audit + fix from $2,500), product builds, and AI &
    finance automation with a person in the loop.

intro:
  eyebrow: Services
  title: Three ways to *work together.*
  sub: >-
    Make an app you built fast safe to run, build a product properly from the
    start, or put AI to work in finance with a person in the loop. I'm based
    in Lagos (UTC+1), with full overlap with the UK and EU.

# Shared label for proof lists and offer prices.
proofTitle: Proof
quoted: Quoted after a call

rescue:
  nav: Rescue & security audit
  eyebrow: 01 · Rescue & security audit
  title: Rescue & *security audit.*
  tagline: Built fast. *Now make it safe.*
  body: >-
    You shipped quickly with Lovable, Bolt, Cursor or v0 on Supabase or
    Firebase. Now it takes payments or holds personal data, and you're not
    sure it's safe. I find the holes, fix the serious ones and prove they're
    closed.
  offers:
    - title: Quick scan
      price: $450
      priceNote: Fixed price
      body: >-
        A fast, written look at where your app is exposed, before you commit to
        anything bigger.
      includes:
        - A written report of your top 10 risks
        - A 30-minute call to walk through it
        - Delivered in 2 days
        - The $450 is credited if you move to audit + fix within 14 days
    - title: Audit + fix
      featured: true
      price: From $2,500
      priceNote: Scope agreed in writing first
      body: >-
        A full audit, then the fixes. Every critical and high issue gets
        fixed, and each fix comes with a test that proves the hole is closed.
      includes:
        - Critical and high issues fixed
        - A test for each fix, proving the hole is closed
        - A written report of everything I found
        - Done in 5 to 7 days
  retainer: >-
    Want someone keeping it stable after the fixes? A monthly stabilise
    retainer is available, quoted after the audit.
  checks:
    title: What I check
    items:
      - Tables with row-level security turned off, or turned on with no policies
      - Firebase security rules that let anyone read or write
      - Service keys and secrets shipped in the browser bundle
      - Storage buckets anyone can read
      - Payment webhooks that don't verify the signature
      - Login and account flows that let one user act as another
  proof:
    - slug: live-app-recovery
      note: >-
        Two live account-takeover paths closed, and 51 row-level security
        policies checked by 47 adversarial tests, in 20 days.
    - slug: tipping-platform
      note: >-
        Money controls on Stripe Connect: two-person refunds, step-up
        verification and a hash-chained audit log.
  cta: Request a quick scan

builds:
  nav: Product builds
  eyebrow: 02 · Product builds
  title: Product *builds.*
  tagline: For software where *mistakes are expensive.*
  body: >-
    For founders and teams whose product handles money, compliance records or
    other people's data, and has to be right from the start.
  offer:
    title: Product build
    body: >-
      Your product, designed, built and deployed end to end, then handed over
      with everything your team needs to run it.
    includes:
      - Architecture and data model
      - Business rules enforced in the database, not only the UI
      - Payments and webhooks that reconcile
      - Integration tests against the running app
      - CI/CD and infrastructure as code
      - Handoff docs, runbooks and a walkthrough
  strengths:
    title: Where I'm strongest
    items:
      - "Data design that enforces the rules: Postgres row-level security, versioned records, audit trails"
      - "Careful payments: Stripe Connect and subscriptions, SeerBit, idempotent webhooks, reconciliation"
      - "Infrastructure I run myself: AWS (Lambda, API Gateway, SQS, RDS, S3, KMS), CloudFormation, Docker"
      - "Range across stacks: TypeScript, Python, C# and PHP; NestJS, Next.js, .NET and Laravel"
      - Taking over inherited systems and getting them stable
  process:
    title: How it *works.*
    steps:
      - title: Discovery
        body: A 30-minute call about the problem, not a sales pitch.
      - title: Scope
        body: A written scope we both agree on before any work starts.
      - title: Build
        body: Weekly demos, so you see progress as it happens.
      - title: Handoff
        body: Documentation, runbooks and a walkthrough for your team.
  proof:
    - slug: food-safety-compliance
      note: >-
        First commit to a public pilot in six weeks. The database itself
        refuses deletes.
    - slug: tipping-platform
      note: >-
        Tips on Stripe Connect where the platform never holds the money, with
        an exact copy of it reconciled nightly.
    - slug: opsflow
      note: >-
        My own product. Fixed code runs before and after the model, so it can
        never confirm a payment.

ai:
  nav: AI & finance automation
  eyebrow: 03 · AI & finance automation
  title: AI kept *in its place.*
  sub: >-
    For finance, compliance and support work, where a wrong answer costs
    money. I build the parts around the model: approval steps, figures
    computed in code, evals and audit trails. The model reads, classifies and
    drafts. People make the calls that matter.
  # Also shown in the AI section on the home page.
  points:
    - Approve, reject and resume flows in Slack, live in production
    - Payroll figures computed in code; the model only writes sentences
    - Output gates that stop a bot from confirming a payment
  principles:
    eyebrow: Principles
    title: Rules for AI that does *real work.*
    items:
      - title: The model never has the final say
        body: >-
          It classifies, extracts and drafts. Approving a payment, posting a
          figure or confirming a refund stays with code and people.
      - title: Arithmetic decides what gets flagged
        body: >-
          A model's confidence is text it writes, not a measurement. Anomalies
          are found by computation, and every one reaches a person.
      - title: Every decision leaves a record
        body: >-
          What ran, what it found, who approved it and when, stored where an
          auditor can read it.
  practice:
    eyebrow: In practice
    title: Uncertainty is *routed, not hidden.*
    body: >-
      When a pipeline isn't sure, it stops and asks. The run pauses, a
      reviewer decides each flagged item in Slack, and the run resumes from
      the decisions stored in the database, not from the chat message.
    # Decorative and labelled illustrative: no client names, internal pipeline
    # names or real figures.
    log:
      file: close-run.log
      status: live
      lines:
        - text: run 0917 · month-end close · started
          tone: muted
        - text: └ bank reconciliation · 1,284 lines matched
          tone: ok
          indent: true
        - text: └ 3 ACH items · carried to next period
          tone: flag
          indent: true
        - text: ⏸ APPROVAL · waiting on reviewer in Slack
          tone: gate
        - text: ✓ approved · resumed as child run · logged
          tone: ok
        - text: run 0917 · workbook ready for QuickBooks
          tone: muted
  offers:
    - title: Finance automation
      body: >-
        For accounting and finance teams: reconciliation, month-end close steps
        and payroll checks, automated under the same rules. Figures come from
        code, anomalies reach a person, and nothing reaches the ledger without
        approval.
      includes:
        - Rules that compute every figure
        - A person approves each flagged item
        - A review workbook and import file for your accountants
        - A record of every run and decision
    - title: Production AI build
      featured: true
      body: >-
        I design and build the system around the model: the pipeline, the
        approval steps, the evals, the audit trail and the AWS infrastructure
        underneath.
      includes:
        - Architecture and system design
        - Human approval and resume
        - Money and business rules computed in code
        - Evals before every release
        - Run tracking and an audit trail
        - Handoff docs, runbooks and a walkthrough
    - title: AI readiness review
      body: >-
        For an AI system that works in the demo but can't get sign-off. I
        review it and write up where it will fail, which controls are missing
        and what to fix first.
      includes:
        - A written report on where it will fail
        - The missing controls, ranked by risk
        - A fix-first plan your team can act on
        - A walkthrough of the findings
  proof:
    - slug: month-end-close
      note: >-
        Built the human-approval and resume system, and wrote the payroll
        pipeline, where every figure is computed in code.
    - slug: opsflow
      note: >-
        Output gates that hold any payment claim or money commitment for a
        person to review.

closing:
  title: Not sure *which fits?*
  body: >-
    Tell me what you're building and where it's stuck. I'll tell you honestly
    whether and how I can help.
